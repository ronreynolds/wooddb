[versions]
assertJ = "3.24.2"
jackson = "2.18.3" # 2025-03-01
jsoup = "1.23.1"
jUnitJupiter = "5.10.2"
jUnitLauncher = "1.11.4"
lombok = "1.18.32"
slf4j = "1.7.25"

[libraries]
assertj-core = { group = "org.assertj", name = "assertj-core", version.ref = "assertJ" }
jackson-core = { group = "com.fasterxml.jackson.core", name = "jackson-core", version.ref = "jackson" }
jackson-databind = { group = "com.fasterxml.jackson.core", name = "jackson-databind", version.ref = "jackson" }
jackson-yaml = { group = "com.fasterxml.jackson.dataformat", name = "jackson-dataformat-yaml", version.ref = "jackson" }
jsoup = { group = "org.jsoup", name = "jsoup", version.ref = "jsoup" }  # https://github.com/jhy/jsoup/
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "jUnitJupiter" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher", version.ref = "jUnitLauncher" }
lombok = { group = "org.projectlombok", name = "lombok", version.ref = "lombok" }
slf4j-api = { group = "org.slf4j", name = "slf4j-api", version.ref = "slf4j" }
slf4j-simple = { group = "org.slf4j", name = "slf4j-simple", version.ref = "slf4j" }